        .piano{

            z-index: 101;
        }

        .key-white.zone-low{
            color: color-mix(in srgb, white 70%, var(--bs-warning));
        }
        .key-black.zone-low{
            color: color-mix(in srgb, black 70%, var(--bs-warning));
        }

        .key-white.zone-normal{
            color: color-mix(in srgb, white 70%, var(--bs-primary));
        }
        .key-black.zone-normal{
            color: color-mix(in srgb, black 70%, var(--bs-primary));
        }

        .key-white.zone-high{
            color: color-mix(in srgb, white 70%, var(--bs-danger));
        }
        .key-black.zone-high{
            color: color-mix(in srgb, black 70%, var(--bs-danger));
        }

        .key-white:hover{
            background-color: color-mix(in srgb, currentColor 90%, black);
        }
        .key-black:hover{
            background-color: color-mix(in srgb, currentColor 75%, white);
        }
        
    </style>

        import { Bank, Z64Rom } from "./js/bankutils.js";
        const ctx = new AudioContext();

        async function saveRom(event){
            $("#loadingOverlay").removeClass("d-none");
            var file = event.target.files[0];
            if (navigator.storage && navigator.storage.persist) {
                await navigator.storage.persist();
            }
            const root = await navigator.storage.getDirectory();
            const fileHandle = await root.getFileHandle('oot.z64', { create: true });
            const writable = await fileHandle.createWritable();
            await file.stream().pipeTo(writable);
            await loadRom();
            $("#loadingOverlay").addClass("d-none");
        }
        async function loadRom() {
            try {
                const root = await navigator.storage.getDirectory();
                const fileHandle = await root.getFileHandle('oot.z64');
                var file = await fileHandle.getFile();
                oot = new Uint8Array(await file.arrayBuffer());

            } catch (err) {
                return null;
            }
        }

        async function init(){
            $("#loadingOverlay").removeClass("d-none");

            await loadRom();

            // Load the banks and samples
            if(oot != null) rom = new Z64Rom(oot);

            // Load main orchestra
            bank = rom.banks[0];
            await loadBank();

            /*for(var sample of rom.sampleBanks[0].samples.sort(function(a, b) { return Number(a.offset) - Number(b.offset); })){
                console.log(`${sample.offset}: "",`);
            }*/

            $("#loadingOverlay").addClass("d-none");
        }

            return `<div class="btn-file row g-0">
                        <span class="col-auto me-3 opacity-25" style="margin-left: .3rem"><i class="fa-solid fa-rotate-90 fa-arrow-turn-up"></i></span>
                        <span class="col-auto opacity-50" style="width: 20px">[${index}]</span>
                        <span class="col ms-3">${name}</span>
                    </div>`;
        }

        }

        async function loadBank(){
            hideAllViews();
            $("#panelBankView").removeClass("d-none");
            $("#titleBankName").text(bank.name);

            // Load the instruments for the sidebar
            $("#collapseInstruments").empty();
            bank.instruments.forEach((inst, i) => $(`#collapseInstruments`).append(buildSelector(i, inst.name)));

            // Load the decoded samples, for easy finding afterwards
            // No manual editing of books or loops >:I
            $("#collapseSamples").empty();
            bank.samples.forEach((sample, i) => {
                var decodedSample = rom.findDecodedSample(bank.sampleBankId1, sample.sampleAddr);
                $(`#collapseSamples`).append(buildSelector(i, decodedSample.name));
            });

            // Load the envelopes
            $("#collapseEnvelopes").empty();
            bank.envelopes.forEach((env, i) => $(`#collapseEnvelopes`).append(buildSelector(i, env.name)));

            // Load the instrument slots
            $("#panelInstrumentSelector").empty();
            bank.instrumentSlots.forEach((instrumentIndex, i) => {
                var instrument = bank.instruments[instrumentIndex];
                $("#panelInstrumentSelector").append(
                    `<div class="row align-items-center g-3 px-3">
                        <b class="mb-0 col-auto" style="width: 70px">Slot ${i}</b>
                        <div class="col">
                            <select id="ddlInstrumentSlot${i}" class="form-control"></select>
                        </div>
                        <i id="btnEditInstrumentSlot${i}" class="icon-button col-auto fa-solid fa-edit" title="Edit this instrument"></i>
                        <i id="btnRemoveInstrumentSlot${i}" class="icon-button col-auto fa-solid fa-minus" title="Remove this insturment slot"></i>
                    </div>
                    <hr class="my-2">`
                );
                
                // Build the selector
                $(`#ddlInstrumentSlot${i}`).append("<option value=''>None</option>");
                for(var inst of bank.instruments){
                    $(`#ddlInstrumentSlot${i}`).append(`<option value="${inst._offset}">${inst.name}</option>`);
                }
                $(`#ddlInstrumentSlot${i}`).val(instrument?._offset);


                $(`#btnEditInstrumentSlot${i}`).on("click", function(){
                    loadInstrumentView($(`#ddlInstrumentSlot${i}`).val());
                });
            });


            // Load the sound effects (not editable currently!)
            $("#panelSoundEffects").empty();
            if(bank.sfx.length == 0) $("#panelSoundEffects").append("<div class='px-3'>No sound effects</div>");
            else bank.sfx.forEach((sfx, i) => {
                var sample = bank.samples.find(s => s._offset == sfx.sample);
                $("#panelSoundEffects").append(
                    `<div class="row align-items-center g-4 px-3">
                        <b class="mb-0 col-auto" style="width: 90px">Slot ${i}</b>
                        <div class="col">
                            <div class="row align-items-center">
                                <label class="col-auto opacity-50">Sample:</label>
                                <input type="text" class="form-control col" value="${rom.findDecodedSample(bank.sampleBankId1, sample?.sampleAddr)?.name || "None"}" disabled />
                                <input type="text" id="txtSfxSampleAddress${i}" class="d-none" value="${sample?.sampleAddr}" />
                            </div>
                        </div>
                        <div class="col">
                            <div class="row align-items-center">
                                <label class="col-auto opacity-50">Tuning:</label>
                                <input type="text" id="txtSfxTuning${i}" class="form-control col" value="${sfx.tuning}" disabled />
                            </div>
                        </div>
                        <i id="btnSfxPlay${i}" class="icon-button col-auto fa-solid fa-play ${(sample ? "" : "opacity-25")}" title="Play"></i>
                    </div>
                    <hr class="my-2">`
                );
                
                if(sample) $(`#btnSfxPlay${i}`).on("click", function(){
                    var tuning = Number($(`#txtSfxTuning${i}`).val());
                    var rate = tuning;

                    var decodedSample = rom.findDecodedSample(bank.sampleBankId1, sample?.sampleAddr);
                    var pcm = decodedSample.decodeVadpcm();
                    
                    const buffer = ctx.createBuffer(1, pcm.length, 32000);   // always 32 kHz, like the game
                    const ch = buffer.getChannelData(0);
                    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;

                    const src = ctx.createBufferSource();
                    src.buffer = buffer;
                    src.playbackRate.value = Math.min(rate, 3.99996); // 4 or more gets clamped, that's an engine limit

                    src.connect(ctx.destination);
                    src.start();
                });

            });

        }

        async function loadInstrumentView(offset){
            var instrument = bank.instruments.find((i) => i._offset == offset);
            if(!instrument) return; // TODO: errors!

            hideAllViews();
            $("#panelInstrumentView").removeClass("d-none");
            $("#titleInstrumentName").text(instrument.name);

            $("#btnLowPitchSample").text(rom.findInstrumentSample(bank, instrument, "low")?.name || "None");
            $("#btnNormalPitchSample").text(rom.findInstrumentSample(bank, instrument, "normal")?.name || "None");
            $("#btnHighPitchSample").text(rom.findInstrumentSample(bank, instrument, "high")?.name || "None");

            $("#txtLowPitchSampleTuning").val(instrument.lowPitchSample.tuning);
            $("#txtNormalPitchSampleTuning").val(instrument.normalPitchSample.tuning);
            $("#txtHighPitchSampleTuning").val(instrument.highPitchSample.tuning);

            $("#txtLowSplit").val(instrument.normalRangeLo);
            $("#txtHighSplit").val(instrument.normalRangeHi);
            $("#txtInstrumentReleaseRate").val(instrument.releaseRate);
        
            buildInstrumentPiano(instrument);
        }

        function hideAllViews(){
            $("#panelBankView, #panelInstrumentView").addClass("d-none");
        }

        

        function buildInstrumentPiano(instrument){
            const blackKeys = [1, 3, 6, 8, 10];
            $(".piano").empty();

            // Add the keys
            var whiteKeyIndex = 0;
            for(var i = 0; i < 128; i++){
                var isBlack = blackKeys.includes(i % 12);
                var style = "";
                if(isBlack) style = `left: calc((${(whiteKeyIndex)} / 75) * 100% - 0.4%)`;
                else whiteKeyIndex++;

                var color = isBlack ? "key-black" : "key-white";
                var zone = "normal";
                if(i < instrument.normalRangeLo) zone = "low";
                else if(i > instrument.normalRangeHi) zone = "high";
                
                // TODO: Also show the tuning limit

                $(".piano").append(`<div class='key ${color} zone-${zone}' style='${style}' data-midi="${i}" data-zone="${zone}"></div>`);
            }

            // Get the samples
            $(".key").on("pointerdown", function(){
                var midi = $(this).attr("data-midi");
                var zone = $(this).attr("data-zone");
                var isDrum = false;
                var tuning = Number($(`#txt${capitalizeFirstLetter(zone)}PitchSampleTuning`).val());
                var rate = isDrum ? tuning : tuning * 2 ** ((midi - 60) / 12);

                var decodedSample = rom.findInstrumentSample(bank, instrument, zone);
                var pcm = decodedSample.decodeVadpcm();
                
                const buffer = ctx.createBuffer(1, pcm.length, 32000);   // always 32 kHz, like the game
                const ch = buffer.getChannelData(0);
                for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;

                const src = ctx.createBufferSource();
                src.buffer = buffer;
                src.playbackRate.value = Math.min(rate, 3.99996); // 4 or more gets clamped, that's an engine limit

                // Do loops
                if (decodedSample.loop.count !== 0) {
                    src.loop = true;
                    src.loopStart = decodedSample.loop.start / 32000;
                    src.loopEnd = decodedSample.loop.end / 32000;
                }

                // TODO: ENVELOPES
                const gain = ctx.createGain();
                gain.gain.value = 1;

                // Start and register this voice
                src.connect(gain).connect(ctx.destination);
                src.start();
                src.onended = () => { if (voices.get(midi)?.src === src) voices.delete(midi); };
                voices.set(midi, {src, gain});
            });

            $(".key").on("pointerup pointerleave pointercancel", function(){
                var midi = $(this).attr("data-midi");
                var releaseRate = Number($("#txtInstrumentReleaseRate").val());

                const v = voices.get(midi);
                if (!v || releaseRate == 0) return;
                voices.delete(midi);

                const now = ctx.currentTime;
                const gain = v.gain.gain;
                const decaySeconds = Math.max(0.005, gain.value * calculateDecay(releaseRate) / 60);

                gain.cancelScheduledValues(now);
                gain.setValueAtTime(gain.value, now);
                gain.linearRampToValueAtTime(0, now + decaySeconds);
                v.src.stop(now + decaySeconds + 0.01);
            });
        }
    
        // Imitate the decay table that exists in the vanilla engine for accuracy
        // https://github.com/zeldaret/oot/blob/main/src/audio/internal/heap.c#L34
        function calculateDecay(releaseRate){
            if(releaseRate >= 255) return 0.25;
            else if(releaseRate == 254) return 0.33;
            else if(releaseRate == 253) return 0.5;
            else if(releaseRate == 252) return 0.66;
            else if(releaseRate == 251) return 0.75;
            else if(releaseRate >= 128) return 251 - releaseRate;
            else if(releaseRate >= 16) return 4 * (143 - releaseRate);
            else if(releaseRate >= 1) return 60 * (23 - releaseRate);
            else return 0;
        }

        function capitalizeFirstLetter(val) {
            return String(val).charAt(0).toUpperCase() + String(val).slice(1);
