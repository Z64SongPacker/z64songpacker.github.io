<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <title>Loudness Calculator</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- JQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/themes/smoothness/jquery-ui.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
  </head>
  <body>
    <script type="importmap">
    {
      "imports": {
        "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/esm/popper.min.js"
      }
    }
    </script>
    <script type="module">
      import { SeqUtils } from "./js/sequtils.js";

      $(function(){
        $("#btnCalculateLoudness").on("click", function(){
            var seqVolume = parseInt($("#txtSeqVolume").val(), 16);
            var originalLoudness = parseFloat($("#txtOriginalLoudness").val());
            var targetLoudness = parseFloat($("#txtTargetLoudness").val());

            var finalVolume = SeqUtils.convertMidiVolumeByLoudness(seqVolume, originalLoudness, targetLoudness);
            console.log(finalVolume);
            $("#txtFinalVolume").val(finalVolume);
        });
      });
    </script>
    <div class="container" style="padding: 100px 10vw;">
        <div class="row justify-content-md-center align-items-end gx-2 pt-3 pb-5">
            <div class="form-group col-3">
                <label>Seq volume (HEX):</label>
                <input id="txtSeqVolume" type="text" class="form-control" tabindex="9" maxlength="2" pattern="[0-9a-fA-F]+">
            </div>
            <div class="form-group col">
                <label>Original loudness (LUFS):</label>
                <input id="txtOriginalLoudness" type="number" class="form-control">
            </div>
            <div class="col-auto">
                <i class="fa-solid fa-arrow-right fa-2x mx-3 mb-2"></i>
            </div>
            <div class="form-group col">
                <label>Target loudness (LUFS):</label>
                <input id="txtTargetLoudness" type="number" class="form-control">
            </div>
            <div class="form-group col-3">
                <label>Final volume (HEX):</label>
                <input id="txtFinalVolume" type="text" class="form-control">
            </div>

            <div class="col-12 text-center pt-3">
                <button type="button" id="btnCalculateLoudness" class="btn btn-primary">Calculate volume</button>
            </div>
        </div>

        <p class="text-center opacity-50">
            Also see <a target="_blank" href="https://theballaam96.github.io/loudness_tester.html">Balaam's Loudness Tester</a> to get the LUFS of preview file.
        </p>
    </div>

  </body>
</html>
